[package]
name = "mailstream-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# GPUI through gpui-kit (MS-226): its `gpui-fast` feature builds on GPUI Fast, longbridge's retained-mode
# gpui that follows Zed's. The crate is named `gpui` here so GPUI's macros (`gpui::…` paths) and
# `use gpui::…` resolve through the kit, which re-exports all of GPUI.
gpui = { package = "gpui-kit", version = "0.9.1", features = ["gpui-fast", "profiler"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# HTML bodies are drawn by the engine's Blitz pages (`blitz_body.rs`) on every platform.
mailstream = { path = "../FFI", default-features = false, features = ["blitz"] }
futures = "0.3"
url = "2"
image = { version = "0.25", default-features = false }

# Tests that draw views in a test window and feed them input as the platform would (the
# calendar's two-finger paging, MS-212).
[dev-dependencies]
gpui = { package = "gpui-kit", version = "0.9.1", features = ["gpui-fast", "profiler", "test-support"] }

# The Mac reader's other renderer, WKWebViews (`webview.rs`), the window's Liquid Glass (`glass.rs`)
# and the Dock icon.
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSURLRequest", "NSValue", "NSGeometry", "NSError", "NSObject", "NSObjCRuntime", "NSData", "NSBundle", "NSSet", "NSDictionary", "NSUserDefaults", "NSURLResponse"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSWorkspace", "NSEvent", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSGlassEffectView", "NSGraphics", "NSColor", "objc2-core-foundation", "NSAppearance"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebpagePreferences", "WKNavigationDelegate", "WKNavigationAction", "WKNavigation", "WKWebsiteDataStore", "WKUIDelegate", "WKWindowFeatures", "WKFrameInfo", "WKURLSchemeHandler", "WKURLSchemeTask"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Blitz's font lookup (fontique) and GPUI's font-kit share fontconfig-sys; with `dlopen` its
# functions become a loaded table, which both then read.
fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"] }

# Stylo (Blitz's CSS engine) 0.22's derives leave an error type to inference that GPUI's build
# makes ambiguous; `vendor/stylo_derive` is 0.22.0 with that one type spelled out (`to_css.rs`).
# `vendor/gpui-fast-linux` is GPUI Fast's Linux platform 0.1.14 with smooth wheel steps and kinetic
# touchpad scrolling on Wayland (MS-208, `src/linux/wayland/scroll_motion.rs` and its use in
# `client.rs`, marked "Mailstream patch").
# `vendor/gpui-fast-wgpu` is GPUI Fast's wgpu renderer and Linux text system 0.1.14 drawing a variable
# font at the weight cosmic-text shaped it at rather than at its default instance, which for Noto
# Sans CJK (the CJK fallback) is Thin (MS-230, `src/cosmic_text_system.rs`, marked "Mailstream patch").
[patch.crates-io]
stylo_derive = { path = "vendor/stylo_derive" }
gpui-fast-linux = { path = "vendor/gpui-fast-linux" }
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }

[profile.dev.package."*"]
opt-level = 2
