[package]
name = "mailstream-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "0.2.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
mailstream = { path = "../FFI" }
futures = "0.3"
url = "2"

[profile.dev.package."*"]
opt-level = 2
