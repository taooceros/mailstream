[package]
name = "mailstream-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "0.2.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
mailstream = { path = "../FFI", default-features = false }
futures = "0.3"
url = "2"

# The HTML reader's WKWebViews and the Dock icon.
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSURLRequest", "NSValue", "NSGeometry", "NSError", "NSObject", "NSObjCRuntime", "NSData", "NSBundle", "NSSet"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSWorkspace", "NSEvent", "NSApplication", "NSImage", "NSMenu", "NSMenuItem"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKWebpagePreferences", "WKNavigationDelegate", "WKNavigationAction", "WKNavigation", "WKWebsiteDataStore", "WKUIDelegate", "WKWindowFeatures", "WKFrameInfo"] }

# Elsewhere the HTML reader draws bodies with the engine's Blitz pages (`blitz_body.rs`).
[target.'cfg(not(target_os = "macos"))'.dependencies]
mailstream = { path = "../FFI", default-features = false, features = ["blitz"] }
image = { version = "0.25", default-features = false }
base64 = "0.22"
# GPUI's font-kit loads fontconfig with dlopen, which turns the shared fontconfig-sys's functions
# into a loaded table; Blitz's font lookup (fontique) must take them from there too.
fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"] }
# libc 0.2.190 dropped Linux's ENOATTR, which xattr 0.2 (GPUI's HTTP client's tar reader) names.
libc = "0.2, <0.2.190"

# Stylo (Blitz's CSS engine) 0.22's derives leave an error type to inference that GPUI's build
# makes ambiguous; `vendor/stylo_derive` is 0.22.0 with that one type spelled out (`to_css.rs`).
[patch.crates-io]
stylo_derive = { path = "vendor/stylo_derive" }

[profile.dev.package."*"]
opt-level = 2
