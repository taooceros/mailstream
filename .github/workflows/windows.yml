name: Windows

# The Rust engine on Windows x64: the engine's tests and an end-to-end smoke test of the UniFFI
# crate's DLL (mailstream.dll). No accounts, secrets or private mail. Windows work is paused with
# Flutter, its only front end (MS-300): this runs only by hand, and no longer builds or launches
# the Flutter app (the steps that did are in this file's history). The engine's tests fail on
# Windows (MS-295).
on:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # Test fixtures compare bytes as committed.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-workspace-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'Engine/Cargo.toml', 'FFI/Cargo.toml', 'FFI/bindgen/Cargo.toml') }}
          restore-keys: windows-cargo-workspace-

      - name: Toolchain
        run: rustup default stable && cargo --version

      - name: Engine tests
        run: cd Engine && cargo test

      # Also after failed tests, so one run shows every step that fails.
      - name: UniFFI crate (mailstream.dll) and the smoke test
        if: ${{ !cancelled() }}
        run: cargo build --release -p mailstream --lib --example smoke

      - name: Smoke test
        if: ${{ !cancelled() }}
        run: target/release/examples/smoke.exe
