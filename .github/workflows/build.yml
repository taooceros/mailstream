name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Swift 6.3, the toolchain the app is developed with.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build (debug, warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # The runner has no OAuth clients, push relay settings or signing identity in its
      # keychain, so the app is signed ad hoc and its Info.plist carries no MS* keys: it
      # launches, but signing in needs a build made with scripts/bundle.sh on a set-up Mac.
      - name: Bundle (release)
        run: ./scripts/bundle.sh

      - name: Archive
        run: ditto -c -k --keepParent build/Mailstream.app Mailstream.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mailstream-${{ github.sha }}
          path: Mailstream.zip
          retention-days: 14

  # One rolling prerelease, "nightly", replaced by every build of main.
  prerelease:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prerelease
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: nightly
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Mailstream-${{ github.sha }}

      - name: Publish
        run: |
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          NOTES="Built from $GITHUB_SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          Signed ad hoc and built without OAuth clients or push settings: it opens, but signing in needs a build from \`scripts/bundle.sh\` on a set-up Mac. After unzipping, run \`xattr -dr com.apple.quarantine Mailstream.app\` before the first launch."
          # Delete the old release and tag, then publish again at this commit, so the tag,
          # the date and the asset all match the newest build.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Mailstream.zip --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($SHORT)" --notes "$NOTES"
