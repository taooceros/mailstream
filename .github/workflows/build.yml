name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Swift 6.3, the toolchain the app is developed with.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      # The Turso engine's static library, built by cargo once per pinned version and patch.
      - uses: actions/cache@v4
        with:
          path: .turso/lib
          key: turso-${{ runner.os }}-${{ hashFiles('scripts/turso.sh', 'scripts/turso-multiprocess.patch', 'Sources/CTurso/sqlite3.h') }}

      - name: Turso
        run: ./scripts/turso.sh

      - name: Build (debug, warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # The runner has no OAuth clients, push relay settings or signing identity in its
      # keychain, so the app is signed ad hoc and its Info.plist carries no MS* keys: it
      # launches, but signing in needs a build made with scripts/bundle.sh on a set-up Mac.
      - name: Bundle (release)
        run: ./scripts/bundle.sh

      # A disk image holding the app beside an Applications link, to drag it across.
      - name: Disk image
        run: |
          mkdir -p build/dmg
          cp -R build/Mailstream.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Mailstream -srcfolder build/dmg -fs HFS+ -format UDZO -ov Mailstream.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: Mailstream-${{ github.sha }}
          path: Mailstream.dmg
          retention-days: 14

  # The GPUI front end, from the same commit, so the prerelease carries both apps. Flutter is
  # paused (MS-300): no job builds it.
  gpui:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gpui-cargo-workspace-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'GPUI/Cargo.toml', 'FFI/Cargo.toml', 'Engine/Cargo.toml') }}
          restore-keys: gpui-cargo-workspace-${{ runner.os }}-

      - name: GPUI (release)
        run: cd GPUI && cargo build --release

      # An app bundle: the binary links the engine. Signed ad hoc, like the other two.
      - name: App bundle and disk image
        run: |
          APP="build/dmg/Mailstream GPUI.app"
          ./scripts/gpui-bundle.sh "$APP"
          ./scripts/sign.sh "$APP"
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Mailstream GPUI" -srcfolder build/dmg -fs HFS+ -format UDZO -ov Mailstream-GPUI.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: Mailstream-GPUI-${{ github.sha }}
          path: Mailstream-GPUI.dmg
          retention-days: 14

  # One rolling prerelease, "nightly", replaced by every build of main.
  prerelease:
    needs: [build, gpui]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: prerelease
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: nightly
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Mailstream-*${{ github.sha }}
          merge-multiple: true

      - name: Publish
        run: |
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          NOTES="Built from $GITHUB_SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID: Mailstream.dmg and Mailstream-GPUI.dmg.

          Signed ad hoc and built without OAuth clients or push settings: they open, but signing in needs a build from \`scripts/bundle.sh\` (or each front end's README) on a set-up Mac. After dragging an app to Applications, run \`xattr -dr com.apple.quarantine \"/Applications/<app name>.app\"\` before the first launch."
          # Delete the old release and tag, then publish again at this commit, so the tag,
          # the date and the asset all match the newest build.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Mailstream.dmg Mailstream-GPUI.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($SHORT)" --notes "$NOTES"
