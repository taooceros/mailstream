name: Publish signed GPUI update

# Every push to main that changes the GPUI app or the engine it links builds, signs and
# publishes a Sparkle update of Mailstream GPUI (MS-219) to the `updates` release, beside
# Mailstream Flutter's but with its own feed, appcast-gpui.xml (GPUI/README.md). Same
# environment, keys and checks as publish-update.yml.
on:
  push:
    branches: [main]
    paths:
      - GPUI/**
      - Engine/**
      - FFI/**
      - scripts/gpui-bundle.sh
      - scripts/apple-tagger.py
      - scripts/sign.sh
      - scripts/prepare-update.py
      - scripts/publish-update.py
      - scripts/verify-update.swift
      - .github/workflows/publish-gpui-update.yml
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel (current builds are prereleases)
        required: true
        type: choice
        default: prerelease
        options: [prerelease, stable]

# One GPUI publication at a time, in push order; Flutter's runs beside it (separate feed and
# archives).
concurrency:
  group: publish-gpui-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: updates
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      UPDATE_PUBLIC_KEY: ${{ vars.MAILSTREAM_UPDATE_PUBLIC_KEY }}
      UPDATE_CHANNEL: ${{ inputs.channel || 'prerelease' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require configured trust and signing material
        env:
          HAS_CERTIFICATE: ${{ secrets.MAILSTREAM_SIGNING_P12 != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.MAILSTREAM_SIGNING_P12_PASSWORD != '' }}
          HAS_UPDATE_KEY: ${{ secrets.MAILSTREAM_UPDATE_PRIVATE_KEY != '' }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || { echo 'Missing approved public update key'; exit 1; }
          test "$HAS_CERTIFICATE" = true || { echo 'Missing shared Apple signing certificate'; exit 1; }
          test "$HAS_CERTIFICATE_PASSWORD" = true || { echo 'Missing Apple signing certificate password'; exit 1; }
          test "$HAS_UPDATE_KEY" = true || { echo 'Missing update signing seed'; exit 1; }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            GPUI/target
          key: gpui-cargo-${{ runner.os }}-${{ hashFiles('GPUI/Cargo.lock', 'FFI/Cargo.toml', 'Engine/Cargo.toml') }}
          restore-keys: gpui-cargo-${{ runner.os }}-
      - name: Choose build number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build=$(python3 scripts/publish-update.py next-version gpui)
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
      - name: Build release
        run: |
          echo "Building update $BUILD_NUMBER"
          (cd GPUI && cargo build --release)
          ./scripts/gpui-bundle.sh
      - name: Sign and prepare authenticated package
        env:
          CERTIFICATE: ${{ secrets.MAILSTREAM_SIGNING_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAILSTREAM_SIGNING_P12_PASSWORD }}
          UPDATE_KEY: ${{ secrets.MAILSTREAM_UPDATE_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          work=$(mktemp -d)
          keychain="$work/signing.keychain-db"
          password=$(openssl rand -hex 24)
          cleanup() { security delete-keychain "$keychain" || true; rm -rf "$work"; }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE" | base64 --decode > "$work/signing.p12"
          printf '%s' "$UPDATE_KEY" > "$work/update-key"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$work/signing.p12" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          app='build/Mailstream GPUI.app'
          /usr/libexec/PlistBuddy -c "Add :MSInstalledRevision string $GITHUB_SHA" "$app/Contents/Info.plist"
          ./scripts/sign.sh "$app"
          # gpui-bundle.sh fetched and checked the pinned Sparkle distribution; its tools are here.
          python3 scripts/prepare-update.py "$app" build/update --sparkle-bin build/sparkle-2.10.1/bin --key-file "$work/update-key"
      - uses: actions/upload-artifact@v7
        with:
          name: Mailstream-GPUI-authenticated-update-${{ github.sha }}
          path: build/update/
          retention-days: 14
      - name: Publish to the updates release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-update.py publish build/update
