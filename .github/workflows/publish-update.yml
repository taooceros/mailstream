name: Publish signed Flutter update

# Every push to main that changes the Flutter app or the engine it links builds, signs and
# publishes a Sparkle update to the `updates` release, which installed copies of Mailstream
# Flutter check (Flutter/README.md). The `updates` environment holds the signing material and
# admits main only; it needs no approval. The ad-hoc rolling nightly is never an update feed.
on:
  push:
    branches: [main]
    paths:
      - Flutter/**
      - Engine/**
      - FFI/**
      - scripts/ffi.py
      - scripts/sign.sh
      - scripts/release-sign.sh
      - scripts/ci-publish.sh
      - scripts/sparkle.sh
      - scripts/prepare-update.py
      - scripts/publish-update.py
      - scripts/verify-update.swift
      - .github/workflows/publish-update.yml
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel (current builds are prereleases)
        required: true
        type: choice
        default: prerelease
        options: [prerelease, stable]

# One publication at a time, in push order: a newer push waits for the running one, and only
# the newest waiting push runs after it.
concurrency:
  group: publish-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: updates
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
      UPDATE_PUBLIC_KEY: ${{ vars.MAILSTREAM_UPDATE_PUBLIC_KEY }}
      UPDATE_CHANNEL: ${{ inputs.channel || 'prerelease' }}
    steps:
      # The release token is handed only to the steps that publish, never left in .git for
      # the build's tools.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require configured trust and signing material
        env:
          HAS_CERTIFICATE: ${{ secrets.MAILSTREAM_SIGNING_P12 != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.MAILSTREAM_SIGNING_P12_PASSWORD != '' }}
          HAS_UPDATE_KEY: ${{ secrets.MAILSTREAM_UPDATE_PRIVATE_KEY != '' }}
        run: |
          test -n "$UPDATE_PUBLIC_KEY" || { echo 'Missing approved public update key'; exit 1; }
          test "$HAS_CERTIFICATE" = true || { echo 'Missing shared Apple signing certificate'; exit 1; }
          test "$HAS_CERTIFICATE_PASSWORD" = true || { echo 'Missing Apple signing certificate password'; exit 1; }
          test "$HAS_UPDATE_KEY" = true || { echo 'Missing update signing seed'; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure public key and channel
        run: |
          printf 'MAILSTREAM_UPDATE_PUBLIC_KEY = %s\nMAILSTREAM_UPDATE_CHANNEL = %s\n' \
            "$UPDATE_PUBLIC_KEY" "$UPDATE_CHANNEL" > Flutter/macos/Runner/Configs/Updates.local.xcconfig
      - name: Choose build number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build=$(python3 scripts/publish-update.py next-version flutter)
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
      - name: Build release
        run: |
          echo "Building update $BUILD_NUMBER"
          CONFIG=release DART_OUT="$PWD/Flutter/packages/mailstream/lib/src" python3 scripts/ffi.py
          cd Flutter
          flutter pub get
          # Xcode fetches Sparkle from GitHub's release downloads, which sometimes answer 504
          # for minutes at a time; a failed fetch fails the build quickly, so try again.
          for attempt in 1 2 3 4 5; do
            flutter build macos --release --build-number "$BUILD_NUMBER" && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 90
          done
      - name: Sign and prepare authenticated package
        env:
          CERTIFICATE: ${{ secrets.MAILSTREAM_SIGNING_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAILSTREAM_SIGNING_P12_PASSWORD }}
          UPDATE_KEY: ${{ secrets.MAILSTREAM_UPDATE_PRIVATE_KEY }}
        run: ./scripts/ci-publish.sh 'Flutter/build/macos/Build/Products/Release/Mailstream Flutter.app'
      - uses: actions/upload-artifact@v7
        with:
          name: Mailstream-authenticated-update-${{ github.sha }}
          path: build/update/
          retention-days: 14
      - name: Publish to the updates release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-update.py publish build/update
