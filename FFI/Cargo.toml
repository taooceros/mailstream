[workspace]
members = [".", "bindgen"]
resolver = "3"

[package]
name = "mailstream"
version = "0.1.0"
edition = "2024"
description = "Mailstream's Swift engine for Rust front ends, and through UniFFI for Dart and others"
publish = false

[lib]
# lib: Rust front ends depend on the crate; cdylib: what UniFFI's Dart (and other) bindings load.
crate-type = ["lib", "cdylib"]

[dependencies]
# uniffi-dart supports this release; move both together.
uniffi = "=0.31.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
thiserror = "2"

[dev-dependencies]
futures-executor = "0.3"
