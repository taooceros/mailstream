[workspace]
members = [".", "bindgen"]
resolver = "3"

[package]
name = "mailstream"
version = "0.1.0"
edition = "2024"
description = "Mailstream's engine for Rust front ends, and through UniFFI for Dart and others"
publish = false

[lib]
# lib: Rust front ends depend on the crate; cdylib: what UniFFI's Dart (and other) bindings load.
crate-type = ["lib", "cdylib"]

[dependencies]
# uniffi-dart supports this release; move both together.
uniffi = "=0.31.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# mail_html.rs: the links a click opens and the inline parts' `file:` URLs.
url = "2"
mailstream-engine = { path = "../Engine" }
# html_page.rs's answers to Dart's async calls; the swift engine's replies too.
futures-channel = "0.3"
# html_page.rs (feature `blitz`): mail HTML laid out and drawn by Blitz (MS-147). No `svg` feature: usvg would
# read files an SVG's `<image>` names.
blitz-dom = { optional = true, version = "=0.3.0-beta.4", default-features = false, features = ["woff", "system-fonts", "floats"] }
blitz-html = { optional = true, version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { optional = true, version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { optional = true, version = "=0.3.0-beta.4", default-features = false }
# html_page.rs: mail always parsed as HTML through blitz-html's tree builder, with the html5ever it
# uses; blitz-html's own entry point parses mail that looks like XHTML as XML (MS-173).
html5ever = { version = "=0.40.1", optional = true }
anyrender = { version = "0.14", optional = true }
anyrender_vello_cpu = { version = "0.18", optional = true }
peniko = { version = "0.6", optional = true }
# Per page, a copy of the system font collection scanned once.
parley = { version = "0.12", optional = true, default-features = false, features = ["std", "system"] }
# html_page.rs: the `@font-face` rules and `@import`s of a mail's stylesheets, read with Blitz's own
# CSS parser so their URLs are the ones it asks for (MS-164).
style = { package = "stylo", version = "=0.22.0", optional = true, default-features = false }
# html_page.rs: the file names of its stylesheet and font cache.
sha2 = { version = "0.10", optional = true }
data-url = { version = "0.3", optional = true }
# Remote images, stylesheets and fonts fetch on a runtime of their own (the engine's is private).
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

# Windows: the message-only window listeners are called through.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

# Linux: GLib's default main context, which listeners are called through.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
glib-sys = "0.21"

[features]
# The Blitz HTML pages (html_page.rs) the Flutter and GPUI readers draw with. On by default (the
# dylib ffi.py builds); GPUI turns it on itself (it takes no default features).
default = ["blitz"]
blitz = ["dep:blitz-dom", "dep:blitz-html", "dep:blitz-paint", "dep:blitz-traits", "dep:html5ever", "dep:anyrender", "dep:anyrender_vello_cpu", "dep:peniko", "dep:parley", "dep:style", "dep:sha2", "dep:data-url", "dep:tokio"]
# MAILSTREAM_ENGINE=swift runs the Swift engine (libMailstreamKit.dylib, which `swift build
# --product MailstreamKit` makes) instead, for examples/bench.rs; front ends never build it.
swift-engine = []

[[example]]
name = "bench"
required-features = ["swift-engine"]

[dev-dependencies]
futures-executor = "0.3"
# examples/bench.rs: concurrent calls, and mail.db written through the Rust engine's cache layer
# (which runs on tokio).
futures = "0.3"
# examples/bench.rs: the avatar cache's file names.
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }

# examples/bench.rs (macOS only, with the Swift engine): process memory and its own Keychain item.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
security-framework = "3"
