[workspace]
members = [".", "bindgen"]
resolver = "3"

[package]
name = "mailstream"
version = "0.1.0"
edition = "2024"
description = "Mailstream's engine (Swift, or Rust with MAILSTREAM_ENGINE=rust) for Rust front ends, and through UniFFI for Dart and others"
publish = false
# Dependents' build scripts read the engine's directory as DEP_MAILSTREAMKIT_DIR (for their rpath).
links = "MailstreamKit"

[lib]
# lib: Rust front ends depend on the crate; cdylib: what UniFFI's Dart (and other) bindings load.
crate-type = ["lib", "cdylib"]

[dependencies]
# uniffi-dart supports this release; move both together.
uniffi = "=0.31.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-channel = "0.3"
thiserror = "2"
# The Rust engine replacing the Swift one, behind MAILSTREAM_ENGINE=rust (MS-110).
mailstream-engine = { path = "../Engine" }

[dev-dependencies]
futures-executor = "0.3"
# examples/bench.rs: concurrent calls, process memory, its own Keychain item, and mail.db
# written through the Rust engine's cache layer (which runs on tokio).
futures = "0.3"
libc = "0.2"
security-framework = "3"
tokio = { version = "1", features = ["rt"] }
