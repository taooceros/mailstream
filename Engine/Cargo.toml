[package]
name = "mailstream-engine"
version = "0.1.0"
edition = "2024"
description = "Mailstream's engine in Rust (Mailstream Flutter and GPUI), with the control socket and the mailstream command line"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
dirs = "6"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2"
# The push relay's socket.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
libc = "0.2"
# mail.db: the Turso version the Swift engine links (scripts/turso.sh), opened with its
# multi-process WAL; no mimalloc, which would take over the host's allocator.
turso = { version = "=0.8.3", default-features = false }
regex = "1"
encoding_rs = "0.8"
unicode-segmentation = "1"
linkify = "0.10"
# Local-time dates: chat list labels, AI tagging's calendar days, outgoing mail's Date header
# and reply attributions.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The zone new calendar events are in (`America/Los_Angeles`); chrono reads it the same way.
iana-time-zone = "0.1"
# Sender pictures: raster decoding and resampling, BIMI's SVG logos, BIMI's DNS TXT records.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "bmp", "webp", "tiff"] }
resvg = { version = "0.45", default-features = false }
hickory-resolver = "0.26"
# Attachment file names in NFC, as the Swift engine sends them (MS-114).
unicode-normalization = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mime_guess = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Windows: sign-ins sealed with DPAPI, the browser through the shell, the host executable's
# version resource.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
