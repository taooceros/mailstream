[package]
name = "mailstream-engine"
version = "0.1.0"
edition = "2024"
description = "Mailstream's engine in Rust, replacing the Swift one (MS-110) phase by phase behind MAILSTREAM_ENGINE=rust"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
dirs = "6"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"
