# Mailstream's mail engine: himalaya 2.2.1 (MIT OR Apache-2.0, by Clément DOUIN and the Pimalaya
# contributors) built as a static library, with a session-pooling entry point in `src/engine.rs`.
# Its own modules are vendored from the crates.io release under `src/`, patched only where they
# wrote to stdout; the dependency set and features are himalaya's.
[package]
name = "mailstream-engine"
description = "himalaya as an in-process mail engine for Mailstream"
version = "2.2.1"
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "mailstream_engine"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
default = ["rustls-ring", "imap", "smtp", "jmap", "gmail", "msgraph", "maildir", "mbox", "sieve", "pimdir", "vendored", "chat"]
native-tls = ["pimalaya-stream/native-tls", "io-pim-discovery/native-tls", "io-imap?/native-tls", "io-jmap?/native-tls", "io-gmail?/native-tls", "io-msgraph?/native-tls", "io-smtp?/native-tls", "io-managesieve?/native-tls"]
rustls-aws = ["pimalaya-stream/rustls-aws", "io-pim-discovery/rustls-aws", "io-imap?/rustls-aws", "io-jmap?/rustls-aws", "io-gmail?/rustls-aws", "io-msgraph?/rustls-aws", "io-smtp?/rustls-aws", "io-managesieve?/rustls-aws"]
rustls-ring = ["pimalaya-stream/rustls-ring", "io-pim-discovery/rustls-ring", "io-imap?/rustls-ring", "io-jmap?/rustls-ring", "io-gmail?/rustls-ring", "io-msgraph?/rustls-ring", "io-smtp?/rustls-ring", "io-managesieve?/rustls-ring"]
imap = ["dep:base64", "dep:io-imap", "dep:mail-parser", "dep:rfc2047-decoder", "io-imap/client"]
smtp = ["dep:io-smtp", "dep:mail-parser"]
jmap = ["dep:base64", "dep:io-jmap", "dep:mail-parser", "io-jmap/client", "io-jmap/schemars"]
gmail = ["dep:io-gmail", "dep:mail-parser", "io-gmail/client", "io-gmail/schemars"]
msgraph = ["dep:io-msgraph", "dep:mail-parser", "io-msgraph/client", "io-msgraph/schemars"]
maildir = ["dep:convert_case", "dep:io-maildir", "dep:mail-parser", "io-maildir/client", "io-maildir/parser"]
mbox = ["dep:io-mbox", "dep:mail-parser", "dep:sha2", "io-mbox/client", "io-mbox/serde"]
m2dir = ["dep:convert_case", "dep:io-m2dir", "dep:mail-parser", "io-m2dir/client"]
sieve = ["dep:io-managesieve", "io-managesieve/client", "io-managesieve/scram"]
pimdir = ["dep:io-pimdir", "dep:mail-parser"]
vendored = ["pimalaya-stream/vendored", "io-pimdir?/vendored"]
# Mailstream's own: Google Chat (`src/chat/`), over the same TLS stream as the mail backends.
chat = ["dep:io-http"]

# Unwinding, not abort: a panic in one request becomes that request's error instead of killing
# the app.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[build-dependencies]
pimalaya-cli = { version = "0.2", default-features = false, features = ["build"] }

[dependencies]
anyhow = "1"
ariadne = "0.6"
base64 = { version = "0.23", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chumsky = { version = "0.13", default-features = false }
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
convert_case = { version = "0.12", optional = true }
crossterm = { version = "0.29", default-features = false, features = ["serde"] }
dirs = "7"
humansize = "2"
io-gmail = { version = "0.4", default-features = false, optional = true }
io-http = { version = "0.5", default-features = false, optional = true }
io-imap = { version = "0.7.1", default-features = false, optional = true }
io-jmap = { version = "0.4.1", default-features = false, optional = true }
io-m2dir = { version = "0.2", default-features = false, optional = true }
io-maildir = { version = "0.3", default-features = false, optional = true }
io-mbox = { version = "0.1", default-features = false, optional = true }
io-managesieve = { version = "0.2", default-features = false, optional = true }
io-msgraph = { version = "0.4", default-features = false, optional = true }
io-pim-discovery = { version = "0.8", default-features = false, features = ["autoconfig", "pacc", "rfc6186", "rfc8620"] }
io-pimdir = { version = "0.5", default-features = false, features = ["client"], optional = true }
io-sasl = { version = "0.1", default-features = false, features = ["scram"] }
io-smtp = { version = "0.5", default-features = false, optional = true }
libc = "0.2"
log = "0.4"
mail-builder = "1"
mail-parser = { version = "0.11", features = ["full_encoding", "serde"], optional = true }
mime_guess = "2"
open = "5"
percent-encoding = "2"
pimalaya-cli = { version = "0.2", default-features = false, features = ["terminal", "table", "prompt", "wizard", "imap", "smtp", "jmap", "spinner"] }
pimalaya-config = { version = "0.2", default-features = false, features = ["toml", "secret"] }
pimalaya-stream = { version = "0.3", default-features = false, features = ["std"] }
rfc2047-decoder = { version = "1", optional = true }
schemars = { version = "1", features = ["chrono04"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = { version = "0.11", optional = true }
shellexpand = "3.1"
toml = "1.1"
url = { version = "2.2", features = ["serde"] }
