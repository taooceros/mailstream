name: mailstream_ui
description: "Flutter desktop front end (macOS, Windows) for Mailstream, running its engine in process."
publish_to: 'none'
version: 0.1.1+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  html: ^0.15.7
  intl: ^0.20.3
  mailstream:
    path: packages/mailstream
  macos_ui: ^2.2.2
  path: ^1.9.1
  video_player: ^2.14.1
  # video_player's Windows implementation (Media Foundation); the Mac keeps AVFoundation.
  video_player_win: ^3.3.1
  markdown: ^7.3.1
  webview_plus: ^0.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
