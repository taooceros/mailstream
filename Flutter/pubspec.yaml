name: mailstream_ui
description: "Flutter macOS front end for Mailstream, over its control socket."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  html: ^0.15.7
  intl: ^0.20.3
  mailstream:
    path: packages/mailstream
  macos_ui: ^2.2.2
  video_player: ^2.14.1
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
