# Every Rust crate in the repo is one cargo workspace with one Cargo.lock and one `target/` here
# (MS-279): a library the engine, FFI and GPUI share compiles once per configuration, and the
# warm build (scripts/warm-build.py) covers every member without naming it. New crates go in
# `members`.
[workspace]
members = ["Engine", "FFI", "FFI/bindgen", "GPUI"]
# Not members: the patched copies of crates.io crates ([patch.crates-io] below) in GPUI/vendor and
# Engine/vendor, and Flutter's Linux runner, which only Flutter's CMake build compiles, with a
# target folder of its own in Flutter/build (Flutter/linux/runner/CMakeLists.txt).
exclude = ["GPUI/vendor", "Engine/vendor", "Flutter/linux/runner"]
resolver = "3"

# Stylo (Blitz's CSS engine) 0.22's derives leave an error type to inference that GPUI's build
# makes ambiguous; `GPUI/vendor/stylo_derive` is 0.22.0 with that one type spelled out (`to_css.rs`).
# `GPUI/vendor/gpui-fast-linux` is GPUI Fast's Linux platform 0.1.14 with smooth wheel steps and
# kinetic touchpad scrolling on Wayland (MS-208, `src/linux/wayland/scroll_motion.rs` and its use in
# `client.rs`, marked "Mailstream patch").
# With MS-407: Wayland and X11 clipboards also read and offer `text/html` alongside plain text.
# `GPUI/vendor/gpui-fast-wgpu` is GPUI Fast's wgpu renderer and Linux text system 0.1.14 drawing a
# variable font at the weight cosmic-text shaped it at rather than at its default instance, which for
# Noto Sans CJK (the CJK fallback) is Thin (MS-230), and loading a variable face matched for another
# weight at the requested one, so Noto Sans's single file draws bold as bold (MS-205; both in
# `src/cosmic_text_system.rs`, marked "Mailstream patch").
# `GPUI/vendor/gpui-fast` is GPUI Fast's core 0.1.14 with two additions to `src/window.rs` (MS-293,
# marked "Mailstream patch"): `Window::frame_signal_at`, when the platform asked for the frame being
# drawn, which the animations' clock (`GPUI/src/swipe.rs`) steps by, and
# `Window::request_animation_frame_at_display_rate`, which keeps a running animation at the
# display's rate in an inactive window or Low Power Mode, where GPUI Fast otherwise draws at 30 fps.
# Its test (`test_display_rate_animation_frames_skip_the_inactive_limit`) runs only in a copy outside
# this workspace, `--features profiler,test-support`, with the published crate's tests that read
# files it doesn't ship (in `style.rs`, `svg_renderer.rs`, `platform.rs`) taken out.
# Its test context can also switch a test window between light and dark
# (`simulate_window_appearance_change`, MS-347, `src/app/test_context.rs`, marked "Mailstream
# patch"), for the views that redo their colors when the system does.
# With MS-407: `ClipboardString` and `ClipboardItem` carry optional `html` (`new_string_with_html`, `html`).
# With MS-411: `composition::reuse_input` assigns the active non-base composition scope to reused
# hitboxes that had no recorded owner before a native surface existed (`src/fast/composition.rs`,
# `src/window.rs`, `src/fast/splice.rs`), so retained deferred overlays stay interactive above
# native Mac web views that appear after them.
# `GPUI/vendor/gpui-fast-macos` is GPUI Fast's Mac platform 0.1.14 spreading each mouse-wheel step
# over a short ease-out instead of applying it in one frame (MS-225, `src/wheel_motion.rs` and its
# use in `window.rs`, marked "Mailstream patch"); touchpads and Magic Mice keep AppKit's own deltas
# and momentum. (The Mac's text checking is the app's own, on gpui-kit's input: MS-351,
# `GPUI/src/text_checking.rs`.)
# With MS-407: macOS `Pasteboard` also reads and writes `public.html` alongside plain text.
# `Engine/vendor/h2` is h2 0.4.20 (HTTP/2 under reqwest) with hyperium/h2 PR #972 (MS-297, in
# `src/proto/streams/counts.rs`, marked "Mailstream patch"): 0.4.20 accepts 100 empty DATA frames
# over a connection's life and then closes it with `too_many_data_frames`, and Google's front end
# sends padding-only frames on every few dozen KB of a body, so a pooled Gmail connection failed
# its requests in flight ("error decoding response body") after a few dozen answers. With the
# patch each frame's data beyond 256 bytes earns empty frames back, up to the same 100. Drop the
# copy once an h2 release carries the fix. Its unit tests run in a copy outside this workspace
# (`cargo test --all-features --lib -- --skip hpack::test::fixture`: the crate ships no fixtures);
# `api::tests::http2_connections_outlast_empty_data_frames` checks it from the engine.
# `Engine/vendor/async-imap` is async-imap 0.12.0 with `Fetch::gmail_thr_id` added to
# `src/types/fetch.rs` (marked "Mailstream patch", MS-358) so Gmail's `X-GM-THRID` can be read
# alongside `gmail_msg_id()`. Drop the copy once an async-imap release carries the method.
# Two copies keep device sync (`Engine/src/peer_sync.rs`) from leaving threads and sockets behind
# each time it closes (MS-378); `peer_sync_tests::closing_releases_threads_and_sockets` checks
# them from the engine. Drop both once iroh-docs takes an iroh-blobs past 0.103 (iroh-blobs 0.105
# and the iroh-util 0.7 it uses carry the fixes).
# `Engine/vendor/iroh-blobs` is iroh-blobs 0.103.1 with two changes 0.105 made (marked "Mailstream
# patch"): its garbage collection loop holds only a weak sender to the store (`src/store/gc.rs` and
# its spawns in `src/store/fs.rs` and `src/store/mem.rs`), where a strong one kept the store's actor
# and its own tokio runtime (a thread per core) alive after every other handle was gone; and the
# actor shuts that runtime down in the background (`RtWrapper` in `src/store/fs.rs`), where
# dropping it on one of its own threads left that thread waiting for itself forever.
# `Engine/vendor/iroh-util` is iroh-util 0.6.0 whose connection pool (iroh-blobs' downloader uses
# it) hands its connection actors a weak sender to the pool's actor (`Context::notify` in
# `src/connection_pool.rs`, marked "Mailstream patch"): the actor owned a strong one, so its inbox
# never closed and it kept the iroh endpoint, with its UDP sockets, alive after closing.
# `GPUI/vendor/taffy` is taffy 0.15.0 with `compute_size_depth` in `src/tree/taffy_tree.rs`
# (marked "Mailstream patch", MS-399): flexbox's `calculate_children_base_lines` calls children with
# `RunMode::PerformLayout` even while the flex container itself is being measured under
# `RunMode::ComputeSize`, which overwrote children's `unrounded_layout` and `final_layout_entry`
# with narrow probe dimensions (e.g. 0px) while the container's own `final_layout_entry` cache
# answered the final `PerformLayout` pass, leaving retained GPUI text truncated to "…" at 0px.

[patch.crates-io]
stylo_derive = { path = "GPUI/vendor/stylo_derive" }
gpui-fast = { path = "GPUI/vendor/gpui-fast" }
gpui-fast-linux = { path = "GPUI/vendor/gpui-fast-linux" }
h2 = { path = "Engine/vendor/h2" }
gpui-fast-macos = { path = "GPUI/vendor/gpui-fast-macos" }
gpui-fast-wgpu = { path = "GPUI/vendor/gpui-fast-wgpu" }
async-imap = { path = "Engine/vendor/async-imap" }
iroh-blobs = { path = "Engine/vendor/iroh-blobs" }
iroh-util = { path = "Engine/vendor/iroh-util" }
taffy = { path = "GPUI/vendor/taffy" }

# Debug builds with optimized dependencies, as GPUI had them on its own; one profile for every
# member, so a debug build of GPUI and the engine's tests share their dependencies.
[profile.dev.package."*"]
opt-level = 2
