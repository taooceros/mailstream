# Every Rust crate in the repo is one cargo workspace with one Cargo.lock and one `target/` here
# (MS-279): a library the engine, FFI and GPUI share compiles once per configuration, and the
# warm build (scripts/warm-build.py) covers every member without naming it. New crates go in
# `members`.
[workspace]
members = ["Engine", "FFI", "FFI/bindgen", "GPUI"]
# Not members: the patched copies of crates.io crates ([patch.crates-io] below) in GPUI/vendor and
# Engine/vendor, and Flutter's Linux runner, which only Flutter's CMake build compiles, with a
# target folder of its own in Flutter/build (Flutter/linux/runner/CMakeLists.txt).
exclude = ["GPUI/vendor", "Engine/vendor", "Flutter/linux/runner"]
resolver = "3"

# Stylo (Blitz's CSS engine) 0.22's derives leave an error type to inference that GPUI's build
# makes ambiguous; `GPUI/vendor/stylo_derive` is 0.22.0 with that one type spelled out (`to_css.rs`).
# `GPUI/vendor/gpui-fast-linux` is GPUI Fast's Linux platform 0.1.14 with smooth wheel steps and
# kinetic touchpad scrolling on Wayland (MS-208, `src/linux/wayland/scroll_motion.rs` and its use in
# `client.rs`, marked "Mailstream patch").
# `GPUI/vendor/gpui-fast-wgpu` is GPUI Fast's wgpu renderer and Linux text system 0.1.14 drawing a
# variable font at the weight cosmic-text shaped it at rather than at its default instance, which for
# Noto Sans CJK (the CJK fallback) is Thin (MS-230), and loading a variable face matched for another
# weight at the requested one, so Noto Sans's single file draws bold as bold (MS-205; both in
# `src/cosmic_text_system.rs`, marked "Mailstream patch").
# `GPUI/vendor/gpui-fast` is GPUI Fast's core 0.1.14 with two additions to `src/window.rs` (MS-293,
# marked "Mailstream patch"): `Window::frame_signal_at`, when the platform asked for the frame being
# drawn, which the animations' clock (`GPUI/src/swipe.rs`) steps by, and
# `Window::request_animation_frame_at_display_rate`, which keeps a running animation at the
# display's rate in an inactive window or Low Power Mode, where GPUI Fast otherwise draws at 30 fps.
# Its test (`test_display_rate_animation_frames_skip_the_inactive_limit`) runs only in a copy outside
# this workspace, `--features profiler,test-support`, with the published crate's tests that read
# files it doesn't ship (in `style.rs`, `svg_renderer.rs`, `platform.rs`) taken out.
# `GPUI/vendor/gpui-fast` also carries text checking's cross-platform half (MS-318, marked "Mailstream
# patch"): `TextAssistance`/`InlinePrediction`/`TextCheckingSettings` and their `PlatformWindow`/
# `Platform` methods (`platform.rs`), `Window::text_assistance` and friends (`window.rs`) and
# `App::text_checking_settings` (`app.rs`). `GPUI/vendor/gpui-fast-macos` is GPUI Fast's Mac platform
# 0.1.14 with the Mac half: `src/text_checking.rs` (NSSpellChecker's spelling, autocorrection and
# inline predictions for the focused input) and its hooks in `src/window.rs` and `src/platform.rs`.
# Both are meant to go upstream as one patch (on MS-318). The same copy also spreads each
# mouse-wheel step over a short ease-out instead of applying it in one frame (MS-225,
# `src/wheel_motion.rs` and its use in `window.rs`, marked "Mailstream patch"); touchpads and Magic
# Mice keep AppKit's own deltas and momentum. Its test context can switch a test window between
# light and dark (`simulate_window_appearance_change`, MS-347, `src/app/test_context.rs`, marked
# "Mailstream patch"), for the views that redo their colors when the system does.
# `Engine/vendor/h2` is h2 0.4.20 (HTTP/2 under reqwest) with hyperium/h2 PR #972 (MS-297, in
# `src/proto/streams/counts.rs`, marked "Mailstream patch"): 0.4.20 accepts 100 empty DATA frames
# over a connection's life and then closes it with `too_many_data_frames`, and Google's front end
# sends padding-only frames on every few dozen KB of a body, so a pooled Gmail connection failed
# its requests in flight ("error decoding response body") after a few dozen answers. With the
# patch each frame's data beyond 256 bytes earns empty frames back, up to the same 100. Drop the
# copy once an h2 release carries the fix. Its unit tests run in a copy outside this workspace
# (`cargo test --all-features --lib -- --skip hpack::test::fixture`: the crate ships no fixtures);
# `api::tests::http2_connections_outlast_empty_data_frames` checks it from the engine.
[patch.crates-io]
stylo_derive = { path = "GPUI/vendor/stylo_derive" }
gpui-fast = { path = "GPUI/vendor/gpui-fast" }
gpui-fast-linux = { path = "GPUI/vendor/gpui-fast-linux" }
h2 = { path = "Engine/vendor/h2" }
gpui-fast-macos = { path = "GPUI/vendor/gpui-fast-macos" }
gpui-fast-wgpu = { path = "GPUI/vendor/gpui-fast-wgpu" }

# Debug builds with optimized dependencies, as GPUI had them on its own; one profile for every
# member, so a debug build of GPUI and the engine's tests share their dependencies.
[profile.dev.package."*"]
opt-level = 2
