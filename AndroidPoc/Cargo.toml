[package]
name = "mailstream-android-poc"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mailstream_android_poc"
crate-type = ["cdylib", "lib"]

[target.'cfg(target_os = "android")'.dependencies]
gpui = { package = "gpui-kit", version = "0.9.1", features = ["gpui-fast", "profiler"] }
gpui-mobile = { path = "vendor/gpui-mobile", default-features = false, features = ["url_launcher", "clipboard", "vibration"] }
mailstream-gpui = { path = "../GPUI" }
mailstream = { path = "../FFI", default-features = false, features = ["blitz"] }
mailstream-engine = { path = "../Engine" }
log = "0.4"
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
ndk = { version = "0.9", features = ["nativewindow"] }
